name: Recover Juarez 2025 Fast

on:
  push:
    branches:
      - recover-juarez-2025-fast

jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        include:
          - handle: "10632"
            filename: "TESIS.pdf"
          - handle: "11545"
            filename: "TESIS.pdf"
          - handle: "11865"
            filename: "Tesis - Obispo Diaz Waldir_C.pdf"
          - handle: "12026"
            filename: "TESIS.pdf"
          - handle: "12084"
            filename: "TESIS.pdf"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover from Internet Archive only
        shell: bash
        run: |
          set -u
          H="${{ matrix.handle }}"
          F="${{ matrix.filename }}"
          mkdir -p recovered
          python3 - "$H" "$F" <<'PY'
          import json, subprocess, pathlib, urllib.parse, sys
          h=sys.argv[1]; fname=sys.argv[2]
          out=pathlib.Path(f"recovered/{h}_TESIS.pdf")
          log=pathlib.Path(f"recovered/{h}_log.txt")
          log.write_text("",encoding="utf-8")

          def note(s):
              print(s,flush=True)
              with log.open("a",encoding="utf-8") as f:f.write(s+"\n")

          def curl(url,timeout=35):
              p=subprocess.run(["curl","-L","--fail","--silent","--show-error","--connect-timeout","7","--max-time",str(timeout),"-A","Mozilla/5.0",url],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if p.returncode:
                  note("curl fail "+str(p.returncode)+" "+url+" "+p.stderr.decode("utf-8","ignore")[:120])
                  return None
              return p.stdout

          patterns=[
              f"repositorio.unjfsc.edu.pe/bitstream/handle/20.500.14067/{h}/*",
              f"repositorio.unjfsc.edu.pe/bitstream/20.500.14067/{h}/*"
          ]
          recs=[]
          for pat in patterns:
              q="https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode({
                  "url":pat,"output":"json","filter":"statuscode:200",
                  "fl":"timestamp,original,mimetype,statuscode,digest","collapse":"digest","limit":"100"
              })
              d=curl(q,30)
              if not d:continue
              try: rows=json.loads(d.decode("utf-8","ignore"))
              except Exception as e: note("parse "+str(e));continue
              if isinstance(rows,list) and len(rows)>1:
                  head=rows[0]
                  for row in rows[1:]: recs.append(dict(zip(head,row)))
              note(f"{pat} records={max(0,len(rows)-1) if isinstance(rows,list) else 0}")

          seen=set(); uniq=[]
          for r in recs:
              k=(r.get("timestamp"),r.get("original"))
              if k in seen:continue
              seen.add(k);uniq.append(r)

          def score(r):
              u=urllib.parse.unquote((r.get("original") or "")).lower()
              s=0
              if ".pdf" in u:s+=100
              if "tesis" in u:s+=70
              if fname.lower() in u:s+=50
              if "sequence=1" in u or "/1/" in u:s+=20
              if "turnitin" in u or "turitin" in u:s-=200
              if "autoriz" in u:s-=200
              return (s,r.get("timestamp",""))
          uniq.sort(key=score,reverse=True)

          for r in uniq[:12]:
              ts=r.get("timestamp"); orig=r.get("original","")
              if not ts or not orig:continue
              low=urllib.parse.unquote(orig).lower()
              if "turnitin" in low or "turitin" in low or "autoriz" in low:continue
              snap=f"https://web.archive.org/web/{ts}id_/{orig}"
              note("TRY "+snap)
              b=curl(snap,60)
              if not b:continue
              p=b.find(b"%PDF-")
              if p<0:continue
              pdf=b[p:]
              e=pdf.rfind(b"%%EOF")
              if e>=0:pdf=pdf[:e+5]
              if len(pdf)>80000:
                  out.write_bytes(pdf)
                  note(f"SUCCESS bytes={len(pdf)}")
                  sys.exit(0)
          note("FAILED")
          PY

          if [ -f "recovered/${H}_TESIS.pdf" ]; then
            pdfinfo "recovered/${H}_TESIS.pdf" | grep -E 'Pages:|File size:' || true
            pdftotext -f 1 -l 3 "recovered/${H}_TESIS.pdf" - 2>/dev/null | head -40 || true
          fi

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: juarez-2025-fast-${{ matrix.handle }}
          path: recovered/*
          retention-days: 2
