name: Recover Juarez 2025 Turnitin Matrix

on:
  push:
    branches:
      - recover-juarez-2025-turnitin-matrix

jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        handle: ["11545","12026","11865","12383","12084"]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Recover archived Turnitin copy
        shell: bash
        run: |
          set -u
          H="${{ matrix.handle }}"
          mkdir -p recovered
          python3 - "$H" <<'PY'
          import json, subprocess, pathlib, urllib.parse, gzip, sys
          h=sys.argv[1]
          out=pathlib.Path(f'recovered/{h}_TURNITIN.pdf')
          log=pathlib.Path(f'recovered/{h}_log.txt'); log.write_text('',encoding='utf-8')
          def note(s):
              print(s,flush=True)
              with log.open('a',encoding='utf-8') as f:f.write(s+'\n')
          def curl(url,timeout=35,headers=None):
              cmd=['curl','-L','--fail','--silent','--show-error','--connect-timeout','7','--max-time',str(timeout),'-A','Mozilla/5.0']
              if headers:
                  for hh in headers: cmd += ['-H',hh]
              cmd.append(url)
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if p.returncode:
                  note('curl fail '+str(p.returncode)+' '+url+' '+p.stderr.decode('utf-8','ignore')[:100]);return None
              return p.stdout
          def pdf(blob):
              if not blob:return None
              p=blob.find(b'%PDF-')
              if p<0:return None
              x=blob[p:];e=x.rfind(b'%%EOF')
              if e>=0:x=x[:e+5]
              return x if len(x)>200000 else None

          pats=[
              f'repositorio.unjfsc.edu.pe/bitstream/handle/20.500.14067/{h}/TURNITIN.pdf*',
              f'repositorio.unjfsc.edu.pe/bitstream/handle/20.500.14067/{h}/*Turnitin*',
              f'repositorio.unjfsc.edu.pe/bitstream/20.500.14067/{h}/2/*',
              f'repositorio.unjfsc.edu.pe/bitstream/handle/20.500.14067/{h}/*'
          ]
          recs=[]
          for pat in pats:
              q='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({
                  'url':pat,'output':'json','filter':'statuscode:200',
                  'fl':'timestamp,original,mimetype,statuscode,digest','collapse':'digest','limit':'100'
              })
              d=curl(q,25)
              if not d:continue
              try:rows=json.loads(d.decode('utf-8','ignore'))
              except:continue
              n=max(0,len(rows)-1) if isinstance(rows,list) else 0
              note(f'IA {pat} {n}')
              if isinstance(rows,list) and len(rows)>1:
                  head=rows[0]
                  for row in rows[1:]: recs.append(dict(zip(head,row)))
          seen=set(); uniq=[]
          for r in recs:
              k=(r.get('timestamp'),r.get('original'))
              if k in seen:continue
              seen.add(k);uniq.append(r)
          uniq.sort(key=lambda r:(
              1 if 'turnitin' in urllib.parse.unquote((r.get('original') or '')).lower() else 0,
              1 if 'sequence=2' in (r.get('original') or '').lower() or '/2/' in (r.get('original') or '') else 0,
              r.get('timestamp','')
          ),reverse=True)
          for r in uniq[:15]:
              ts=r.get('timestamp');u=r.get('original','')
              if not ts or not u:continue
              low=urllib.parse.unquote(u).lower()
              if 'autoriz' in low or 'license' in low:continue
              b=curl(f'https://web.archive.org/web/{ts}id_/{u}',55)
              x=pdf(b)
              if x:
                  out.write_bytes(x);note(f'SUCCESS IA {len(x)} {u}');sys.exit(0)

          indexes=['CC-MAIN-2026-39','CC-MAIN-2026-34','CC-MAIN-2026-30','CC-MAIN-2026-25','CC-MAIN-2026-21','CC-MAIN-2026-17','CC-MAIN-2026-12','CC-MAIN-2026-08','CC-MAIN-2026-04','CC-MAIN-2025-51','CC-MAIN-2025-47','CC-MAIN-2025-43']
          targets=[f'repositorio.unjfsc.edu.pe/bitstream/handle/20.500.14067/{h}/*',f'repositorio.unjfsc.edu.pe/bitstream/20.500.14067/{h}/*']
          for idx in indexes:
              for target in targets:
                  q='https://index.commoncrawl.org/'+idx+'-index?'+urllib.parse.urlencode({'url':target,'output':'json'})
                  d=curl(q,12)
                  if not d:continue
                  rr=[]
                  for line in d.decode('utf-8','ignore').splitlines():
                      try:rr.append(json.loads(line))
                      except:pass
                  for rec in rr:
                      if str(rec.get('status',''))!='200':continue
                      u=urllib.parse.unquote((rec.get('url') or '')).lower()
                      if 'turnitin' not in u and '/2/' not in u:continue
                      fn=rec.get('filename');off=rec.get('offset');ln=rec.get('length')
                      if not(fn and off and ln):continue
                      try:s=int(off);l=int(ln);e=s+l-1
                      except:continue
                      raw=curl('https://data.commoncrawl.org/'+fn,55,[f'Range: bytes={s}-{e}'])
                      if not raw:continue
                      try:dec=gzip.decompress(raw)
                      except:continue
                      x=pdf(dec)
                      if x:
                          out.write_bytes(x);note(f'SUCCESS CC {idx} {len(x)}');sys.exit(0)
          note('FAILED')
          PY
          if [ -f "recovered/${H}_TURNITIN.pdf" ]; then
            pdfinfo "recovered/${H}_TURNITIN.pdf" | grep -E 'Pages:|File size:' || true
            pdftotext -f 1 -l 3 "recovered/${H}_TURNITIN.pdf" - 2>/dev/null | head -50 || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: juarez-2025-turnitin-${{ matrix.handle }}
          path: recovered/*
          retention-days: 2
