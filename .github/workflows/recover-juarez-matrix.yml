name: Recover Juarez UNJFSC matrix

on:
  push:
    branches:
      - recover-juarez-matrix

jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        handle: ["9498","10028","5434","6594","9684","8400","7829","6398","8452","11545","12026","9839"]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Recover one thesis
        shell: bash
        run: |
          set -u
          H="${{ matrix.handle }}"
          mkdir -p recovered
          python3 - "$H" <<'PY'
          import json, subprocess, pathlib, urllib.parse, sys
          h=sys.argv[1]
          out=pathlib.Path(f"recovered/{h}_TESIS.pdf")
          log=pathlib.Path(f"recovered/{h}_log.txt")

          def note(s):
              print(s,flush=True)
              with log.open("a",encoding="utf-8") as f:f.write(s+"\n")
          log.write_text("",encoding="utf-8")

          def curl(url,timeout=40):
              p=subprocess.run(["curl","-L","--fail","--silent","--show-error","--connect-timeout","7","--max-time",str(timeout),"-A","Mozilla/5.0",url],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if p.returncode:
                  note("curl fail "+str(p.returncode)+" "+url+" "+p.stderr.decode("utf-8","ignore")[:120])
                  return None
              return p.stdout

          def records(pattern):
              q="https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode({
                  "url":pattern,"output":"json","filter":"statuscode:200",
                  "fl":"timestamp,original,mimetype,statuscode,digest",
                  "collapse":"digest","limit":"150"
              })
              d=curl(q,35)
              if not d:return []
              try:r=json.loads(d.decode("utf-8","ignore"))
              except Exception as e: note("parse "+str(e)); return []
              if not isinstance(r,list) or len(r)<2:return []
              head=r[0];return [dict(zip(head,x)) for x in r[1:]]

          pats=[
              f"repositorio.unjfsc.edu.pe/bitstream/handle/20.500.14067/{h}/*",
              f"repositorio.unjfsc.edu.pe/bitstream/20.500.14067/{h}/*"
          ]
          rr=[]
          for p in pats:
              x=records(p);note(f"{p} records={len(x)}");rr.extend(x)
          seen=set();uniq=[]
          for r in rr:
              k=(r.get("timestamp"),r.get("original"))
              if k in seen:continue
              seen.add(k);uniq.append(r)
          def score(r):
              u=(r.get("original") or "").lower();s=0
              if ".pdf" in u:s+=100
              if "tesis" in u:s+=60
              if "/1/" in u or "sequence=1" in u:s+=25
              if "turnitin" in u or "turitin" in u:s-=150
              if "autoriz" in u:s-=150
              if "license" in u or u.endswith(".txt"):s-=300
              return (s,r.get("timestamp",""))
          uniq.sort(key=score,reverse=True)
          for r in uniq[:25]:
              u=r.get("original","");ts=r.get("timestamp","")
              low=u.lower()
              if not ts or not u or "turnitin" in low or "turitin" in low or "autoriz" in low or "license" in low:continue
              note("TRY "+ts+" "+u)
              b=curl(f"https://web.archive.org/web/{ts}id_/{u}",70)
              if not b:continue
              p=b.find(b"%PDF-")
              if p<0:continue
              pdf=b[p:];e=pdf.rfind(b"%%EOF")
              if e>=0:pdf=pdf[:e+5]
              if len(pdf)>80000:
                  out.write_bytes(pdf);note(f"SUCCESS bytes={len(pdf)}");sys.exit(0)
          note("FAILED")
          PY
          if [ -f "recovered/${H}_TESIS.pdf" ]; then
            pdfinfo "recovered/${H}_TESIS.pdf" | grep -E 'Pages:|File size:' || true
            pdftotext -f 1 -l 5 "recovered/${H}_TESIS.pdf" - 2>/dev/null | head -45 || true
          fi

      - name: Upload one result
        uses: actions/upload-artifact@v4
        with:
          name: unjfsc-${{ matrix.handle }}
          path: recovered/*
          retention-days: 2
